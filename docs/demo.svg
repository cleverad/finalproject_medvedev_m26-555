      </tspan><tspan y="298.66659200000004">
        <tspan dy="1em" x="0.0">Изменения в портфеле:                                                                               </tspan>
      </tspan><tspan y="317.333254">
        <tspan dy="1em" x="0.0">- BTC: было 0.0500 → стало 0.0400                                                                   </tspan>
      </tspan><tspan y="335.99991600000004">
        <tspan dy="1em" x="0.0">- USD: было 6132.10 → стало 6905.68                                                                 </tspan>
      </tspan><tspan y="354.666578">
