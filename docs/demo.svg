      </tspan><tspan y="223.99994400000003">
        <tspan dy="1em" x="0.0">- USD: было 10000.00 → стало 6132.10                                                                </tspan>
      </tspan><tspan y="242.66660600000003">
        <tspan dy="1em" x="0.0">Оценочная стоимость покупки: 3,867.90 USD                                                           </tspan>
      </tspan><tspan y="261.33326800000003">
